<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#eef2f1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Quina hora és?</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="Taller">
<link rel="apple-touch-icon" href="../assets/icons/icon-180.png">
<link rel="icon" href="../assets/icons/icon-192.png">
<link rel="stylesheet" href="../assets/base.css">
<link rel="stylesheet" href="../assets/taller.css">
<style>
/* Rellotge de busques a l'esquerra; a la dreta, la pregunta i les respostes o els botons per moure'l. */
.play{display:grid;grid-template-columns:minmax(0,420px) minmax(240px,1fr);gap:20px;align-items:start}
@media (max-width:820px){.play{grid-template-columns:1fr}}
.clock{width:100%;max-width:420px;height:auto;display:block;margin:0 auto;touch-action:none}
.clock.set{cursor:grab}
.side{display:flex;flex-direction:column;gap:12px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{min-height:56px;border-radius:16px;border:2px solid var(--rule);background:var(--paper);font-size:20px;font-weight:700;text-align:left;padding:8px 18px}
.opt.good{background:var(--accent-soft);border-color:var(--accent)}
.opt.tried{opacity:.5}
.digital{font-family:var(--font-display);font-size:2.6rem;font-weight:700;text-align:center;font-variant-numeric:tabular-nums;background:var(--paper);border:2px solid var(--rule-soft);border-radius:16px;padding:6px 18px;align-self:flex-start}
.moves{display:grid;grid-template-columns:repeat(4,auto);gap:8px;justify-content:start}
@media (max-width:420px){.moves{grid-template-columns:repeat(2,auto)}}
.say{font-family:var(--font-display);font-size:1.5rem;font-weight:700;color:var(--accent)}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a class="volver" href="./">← Taller</a>
    <h1>Quina hora és?</h1>
  </div>

  <section id="levelsView" class="wrap" style="gap:14px">
    <p class="muted">L'agulla petita diu l'hora i la llarga, els quarts. En català es diu «un quart de», «dos quarts de» i «tres quarts de»… l'hora que ve!</p>
    <div class="levels" id="levels"></div>
  </section>

  <section id="playView" class="wrap" style="gap:14px" hidden>
    <div class="row" style="justify-content:space-between">
      <h2 id="levelName"></h2>
      <div class="dots" id="dots"></div>
    </div>
    <div class="stage">
      <div class="play">
        <div><svg class="clock" id="clock" viewBox="0 0 300 300" role="img" aria-label="Rellotge"></svg></div>
        <div class="side" id="side"></div>
      </div>
    </div>
  </section>
</div>

<script src="../assets/taller.js"></script>
<script>
(function(){
  var GAME = "rellotge";
  var $ = function(id){ return document.getElementById(id); };
  var NAMES = ["dotze","una","dues","tres","quatre","cinc","sis","set","vuit","nou","deu","onze","dotze"];

  function hourOf(t){ var h = Math.floor(t / 60) % 12; return h === 0 ? 12 : h; }
  function de(n){ return (n === 1 || n === 11) ? "d'" + NAMES[n] : "de " + NAMES[n]; }
  // Frase en català d'una hora (minuts 0, 15, 30 o 45)
  function frase(t){
    t = ((t % 720) + 720) % 720;
    var h = hourOf(t), m = t % 60, next = h === 12 ? 1 : h + 1;
    if (m === 0) return h === 1 ? "És la una en punt" : "Són les " + NAMES[h] + " en punt";
    if (m === 15) return "És un quart " + de(next);
    if (m === 30) return "Són dos quarts " + de(next);
    return "Són tres quarts " + de(next);
  }
  function digital(t){ t = ((t % 720) + 720) % 720; var m = t % 60; return hourOf(t) + ":" + (m < 10 ? "0" : "") + m; }
  function rnd(n){ return Math.floor(Math.random() * n); }
  function randTime(quarters){ return (rnd(12)) * 60 + (quarters ? 15 * rnd(4) : 0); }

  function rounds(n){ var a = []; for (var i = 0; i < n; i++) a.push(i); return a; }
  var LEVELS = [
    { name:"En punt", desc:"L'agulla llarga a dalt de tot. Quina hora és?", mode:"read", q:false, ch:rounds(4) },
    { name:"Els quarts", desc:"Un quart, dos quarts i tres quarts.", mode:"read", q:true, ch:rounds(6) },
    { name:"Posa l'hora", desc:"Mou les agulles fins a l'hora que et diuen.", mode:"set", ch:rounds(5) },
    { name:"Rellotge digital", desc:"Com es diu en català l'hora d'un rellotge de números?", mode:"digital", ch:rounds(5) },
    { name:"Què passarà?", desc:"Quina hora serà d'aquí a una estona?", mode:"later", ch:rounds(4) }
  ];
  var LATER = [[15, "un quart"], [30, "mitja hora"], [60, "una hora"], [45, "tres quarts d'hora"]];

  var li, ci, t, target, solved, setMode;

  // ---------- rellotge ----------
  var svg = $("clock");
  (function face(){
    var s = '<circle cx="150" cy="150" r="140" fill="var(--paper)" stroke="var(--rule)" stroke-width="6"/>';
    for (var i = 0; i < 60; i++){
      var a = i * 6 * Math.PI / 180, r1 = i % 5 ? 128 : 120, r2 = 134;
      s += '<line x1="' + (150 + r1 * Math.sin(a)) + '" y1="' + (150 - r1 * Math.cos(a)) + '" x2="' + (150 + r2 * Math.sin(a)) + '" y2="' + (150 - r2 * Math.cos(a)) + '" stroke="var(--muted)" stroke-width="' + (i % 5 ? 1.5 : 3) + '"/>';
    }
    for (var n = 1; n <= 12; n++){
      var b = n * 30 * Math.PI / 180;
      s += '<text x="' + (150 + 100 * Math.sin(b)) + '" y="' + (150 - 100 * Math.cos(b) + 9) + '" text-anchor="middle" font-size="26" font-weight="700" font-family="Andika, sans-serif" fill="var(--fg)">' + n + '</text>';
    }
    s += '<line id="hh" x1="150" y1="150" x2="150" y2="85" stroke="var(--fg)" stroke-width="10" stroke-linecap="round"/>';
    s += '<line id="mh" x1="150" y1="150" x2="150" y2="40" stroke="var(--accent)" stroke-width="6" stroke-linecap="round"/>';
    s += '<circle cx="150" cy="150" r="8" fill="var(--fg)"/>';
    svg.innerHTML = s;
  })();
  function drawClock(){
    var tt = ((t % 720) + 720) % 720;
    $("hh").setAttribute("transform", "rotate(" + (tt / 720 * 360) + " 150 150)");
    $("mh").setAttribute("transform", "rotate(" + ((tt % 60) / 60 * 360) + " 150 150)");
    svg.setAttribute("aria-label", "Rellotge que marca " + digital(tt));
  }

  // Arrossegar l'agulla llarga (l'agulla petita la segueix, com en un rellotge de veritat)
  var dragging = false;
  function angleFrom(e){
    var pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
    var p = pt.matrixTransform(svg.getScreenCTM().inverse());
    var a = Math.atan2(p.x - 150, 150 - p.y) * 180 / Math.PI; return (a + 360) % 360;
  }
  function moveTo(e){
    var m = Math.round(angleFrom(e) / 30) * 5 % 60, cur = ((t % 60) + 60) % 60, d = m - cur;
    if (d > 30) d -= 60; if (d < -30) d += 60;
    if (d){ t = (t + d + 720) % 720; drawClock(); clearMsg(); }
  }
  svg.addEventListener("pointerdown", function(e){ if (!setMode || solved) return; e.preventDefault(); dragging = true; try { svg.setPointerCapture(e.pointerId); } catch(err){} moveTo(e); });
  svg.addEventListener("pointermove", function(e){ if (dragging) moveTo(e); });
  ["pointerup","pointercancel"].forEach(function(ev){ svg.addEventListener(ev, function(){ dragging = false; }); });

  // ---------- nivells ----------
  function showLevels(){
    $("playView").hidden = true; $("levelsView").hidden = false;
    Taller.levelCards($("levels"), GAME, LEVELS, function(l, c){ li = l; ci = c; start(); });
    window.scrollTo(0, 0);
  }
  function dots(){ Taller.dots($("dots"), LEVELS[li].ch.length, ci, function(i){ return Taller.done(GAME, "L" + li + "-" + i); }); }
  var msgEl;
  function clearMsg(){ if (msgEl) Taller.msg(msgEl, ""); }

  function start(){
    $("levelsView").hidden = true; $("playView").hidden = false;
    var L = LEVELS[li]; solved = false; setMode = false;
    $("levelName").textContent = "Nivell " + (li + 1) + " · " + L.name; dots();
    var side = $("side"); side.innerHTML = "";
    var ask = document.createElement("p"); ask.className = "ask"; side.appendChild(ask);
    var body = document.createElement("div"); body.className = "side"; side.appendChild(body);
    msgEl = document.createElement("div"); msgEl.className = "msg"; msgEl.setAttribute("role", "status"); msgEl.setAttribute("aria-live", "polite"); side.appendChild(msgEl);
    var btns = document.createElement("div"); btns.className = "row"; side.appendChild(btns);
    var next = button("Següent →", "btn primary", function(){ if (ci < L.ch.length - 1){ ci++; start(); } else showLevels(); });
    next.hidden = true;
    var back = button("Tria nivell", "btn", showLevels);

    function win(extra){
      solved = true; Taller.markDone(GAME, "L" + li + "-" + ci); dots();
      var last = ci === L.ch.length - 1;
      Taller.msg(msgEl, Taller.praise() + (extra ? " " + extra : "") + (last ? " Has acabat el nivell!" : ""), "good");
      next.hidden = false; next.textContent = last ? "Tria un altre nivell" : "Següent →";
      svg.classList.remove("set"); setMode = false;
    }

    if (L.mode === "read" || L.mode === "digital"){
      t = randTime(L.mode === "digital" ? true : L.q);
      if (L.mode === "read" && L.q && t % 60 === 0) t += 15 * (1 + rnd(3));
      drawClock();
      if (L.mode === "digital"){
        ask.textContent = "Com es diu aquesta hora?";
        var dg = document.createElement("div"); dg.className = "digital"; dg.textContent = digital(t); body.appendChild(dg);
        svg.style.visibility = "hidden";
      } else { ask.textContent = "Quina hora marca el rellotge?"; svg.style.visibility = "visible"; }
      var right = frase(t), opts = [right];
      var cand = [t + 60, t - 60, t + 15, t - 15, t + 30, t + 45].map(frase).filter(function(f){ return f !== right; });
      while (opts.length < 3 && cand.length){ var pick = cand.splice(rnd(cand.length), 1)[0]; if (opts.indexOf(pick) < 0) opts.push(pick); }
      opts.sort(function(){ return Math.random() - .5; });
      var box = document.createElement("div"); box.className = "opts"; body.appendChild(box);
      opts.forEach(function(o){
        var b = button(o, "opt", function(){
          if (solved) return;
          if (o === right){ b.classList.add("good"); win(L.mode === "digital" ? "" : ""); if (L.mode === "digital"){ svg.style.visibility = "visible"; } }
          else { b.classList.add("tried"); Taller.msg(msgEl, L.mode === "digital" ? "No és aquesta. Pensa on seria l'agulla llarga: als minuts :15 és un quart, als :30 dos quarts i als :45 tres quarts. I amb els quarts es diu l'hora que ve." : hintFor(t, true), "think"); }
        });
        box.appendChild(b);
      });
    } else {
      setMode = true; svg.classList.add("set"); svg.style.visibility = "visible";
      if (L.mode === "set"){
        target = randTime(true); t = 0;
        ask.textContent = "Posa el rellotge a: " + frase(target).replace(/^(És|Són) /, "").replace(/^la una/, "la una");
        var say = document.createElement("p"); say.className = "say"; say.textContent = frase(target) + "."; body.appendChild(say);
        ask.textContent = "Posa el rellotge a aquesta hora:";
      } else {
        var start0 = randTime(true), add = LATER[ci % LATER.length];
        t = start0; target = start0 + add[0];
        ask.textContent = frase(start0) + ". Quina hora serà d'aquí a " + add[1] + "? Mou el rellotge.";
      }
      drawClock();
      body.insertAdjacentHTML("beforeend", '<p class="muted" style="font-size:16px">Arrossega l\'agulla llarga amb el dit, o fes servir els botons.</p>');
      var mv = document.createElement("div"); mv.className = "moves"; body.appendChild(mv);
      [["−1 hora", -60], ["−5 min", -5], ["+5 min", 5], ["+1 hora", 60]].forEach(function(p){
        mv.appendChild(button(p[0], "btn soft", function(){ if (solved) return; t = (t + p[1] + 720) % 720; drawClock(); clearMsg(); }));
      });
      btns.appendChild(button("Comprova", "btn primary", function(){
        if (solved) return;
        if (((t - target) % 720 + 720) % 720 === 0) win("El rellotge marca " + digital(t) + ".");
        else Taller.msg(msgEl, "Encara no. Ara el rellotge diu: «" + frase(t) + "». " + hintFor(target), "think");
      }));
    }
    btns.appendChild(next); btns.appendChild(back);
    window.scrollTo(0, 0);
  }

  function hintFor(tt, reading){
    tt = ((tt % 720) + 720) % 720;
    var m = tt % 60;
    var pos = m === 0 ? "a dalt de tot, al 12: en punt" : (m === 15 ? "al 3: un quart" : (m === 30 ? "al 6: dos quarts" : "al 9: tres quarts"));
    var s = "Pista: l'agulla llarga " + (reading ? "és " : "ha d'estar ") + pos + ".";
    if (m) s += " I recorda: amb els quarts es diu l'hora que ve.";
    return s;
  }

  function button(text, cls, fn){ var b = document.createElement("button"); b.type = "button"; b.className = cls; b.textContent = text; b.addEventListener("click", fn); return b; }

  window.__rellotge = { frase:frase };
  showLevels();
})();
</script>
</body>
</html>
