<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#eef2f1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Fraccions iguals</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="Taller">
<link rel="apple-touch-icon" href="../assets/icons/icon-180.png">
<link rel="icon" href="../assets/icons/icon-192.png">
<link rel="stylesheet" href="../assets/base.css">
<link rel="stylesheet" href="../assets/taller.css">
<style>
/* Dues barres de xocolata, una sobre l'altra, igual de llargues. A l'esquerra, la fracció de cada barra. */
.bars{display:flex;flex-direction:column;gap:16px}
.barRow{display:grid;grid-template-columns:72px minmax(0,1fr);gap:12px;align-items:center}
.bar{display:flex;gap:3px;height:72px;padding:3px;border-radius:12px;background:var(--rule-soft);touch-action:manipulation}
.part{flex:1 1 0;min-width:0;border:none;border-radius:8px;background:var(--paper);padding:0}
.bar.upper .part.on{background:var(--sky)}
.bar.lower .part.on{background:var(--warm)}
.bar.fixed .part{cursor:default}
.frac{display:inline-flex;flex-direction:column;align-items:center;font-family:var(--font-display);font-size:1.7rem;font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums}
.frac span:first-child{border-bottom:3px solid currentColor;padding:0 6px}
.frac.upper{color:var(--sky)} .frac.lower{color:var(--warm)}
.choices{display:flex;flex-wrap:wrap;gap:10px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a class="volver" href="./">← Taller</a>
    <h1>Fraccions iguals</h1>
  </div>

  <section id="levelsView" class="wrap" style="gap:14px">
    <p class="muted">Dues barres de xocolata iguals, partides de maneres diferents. Pots menjar el mateix trossejant-la diferent?</p>
    <div class="levels" id="levels"></div>
  </section>

  <section id="playView" class="wrap" style="gap:14px" hidden>
    <div class="row" style="justify-content:space-between">
      <h2 id="levelName"></h2>
      <div class="dots" id="dots"></div>
    </div>
    <div class="stage" id="stage"></div>
  </section>
</div>

<script src="../assets/taller.js"></script>
<script>
(function(){
  var GAME = "fraccions";
  var $ = function(id){ return document.getElementById(id); };

  var LEVELS = [
    { name:"Meitats", desc:"La meitat d'una barra, partida en més trossos.", mode:"match", ch:[[1,2,4],[1,2,6],[1,2,8],[1,2,10]] },
    { name:"Terços i quarts", desc:"Pinta el mateix tros que la barra de dalt.", mode:"match", ch:[[1,3,6],[2,3,6],[1,4,8],[3,4,8],[2,3,9]] },
    { name:"Tria els trossos", desc:"Tu decideixes en quants trossos parteixes la barra.", mode:"choose", ch:[[1,2],[2,3],[3,4],[2,5]] },
    { name:"Quina és més gran?", desc:"Compara dues fraccions.", mode:"compare", ch:[[[2,3],[3,4]],[[3,6],[1,2]],[[2,5],[1,3]],[[5,8],[3,4]],[[4,6],[2,3]]] }
  ];

  var li, ci;

  function showLevels(){
    $("playView").hidden = true; $("levelsView").hidden = false;
    Taller.levelCards($("levels"), GAME, LEVELS, function(l, c){ li = l; ci = c; start(); });
    window.scrollTo(0, 0);
  }
  function dots(){ Taller.dots($("dots"), LEVELS[li].ch.length, ci, function(i){ return Taller.done(GAME, "L" + li + "-" + i); }); }
  function el(tag, cls, text){ var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function frac(n, d, cls){ var f = el("span", "frac " + cls); f.appendChild(el("span", "", n)); f.appendChild(el("span", "", d)); return f; }

  function barRow(n, d, kind, onTap, state){
    var row = el("div", "barRow");
    var lab = el("div"); lab.appendChild(frac(n, d, kind)); row.appendChild(lab);
    var bar = el("div", "bar " + kind + (onTap ? "" : " fixed"));
    for (var i = 0; i < d; i++){
      var p = el("button", "part"); p.type = "button";
      var on = state ? !!state[i] : i < n;
      if (on) p.classList.add("on");
      p.setAttribute("aria-label", "Tros " + (i + 1) + " de " + d + (on ? ", pintat" : ""));
      if (onTap) (function(i){ p.addEventListener("click", function(){ onTap(i); }); })(i);
      bar.appendChild(p);
    }
    row.appendChild(bar);
    return row;
  }

  function start(){
    $("levelsView").hidden = true; $("playView").hidden = false;
    var L = LEVELS[li], c = L.ch[ci], st = $("stage"), solved = false;
    $("levelName").textContent = "Nivell " + (li + 1) + " · " + L.name; dots();
    st.innerHTML = "";
    var ask = el("p", "ask"); st.appendChild(ask);
    var bars = el("div", "bars"); st.appendChild(bars);
    var extra = el("div", "row"); st.appendChild(extra);
    var msg = el("div", "msg"); msg.setAttribute("role", "status"); msg.setAttribute("aria-live", "polite"); st.appendChild(msg);
    var btns = el("div", "row"); st.appendChild(btns);
    var next = el("button", "btn primary", "Següent →"); next.type = "button"; next.hidden = true;
    next.addEventListener("click", function(){ if (ci < L.ch.length - 1){ ci++; start(); } else showLevels(); });
    var back = el("button", "btn", "Tria nivell"); back.type = "button"; back.addEventListener("click", showLevels);

    function win(text){
      solved = true; Taller.markDone(GAME, "L" + li + "-" + ci); dots();
      var last = ci === L.ch.length - 1;
      Taller.msg(msg, Taller.praise() + " " + text + (last ? " Has acabat el nivell!" : ""), "good");
      next.hidden = false; next.textContent = last ? "Tria un altre nivell" : "Següent →";
      if (chk) chk.hidden = true;
    }

    var chk = null;
    if (L.mode === "match" || L.mode === "choose"){
      var n1 = c[0], d1 = c[1], d2 = L.mode === "match" ? c[2] : 2, mine = {};
      ask.textContent = L.mode === "match"
        ? "Pinta a la barra de baix la mateixa quantitat de xocolata que a la de dalt."
        : "Parteix la barra de baix en un altre nombre de trossos i pinta'n la mateixa quantitat que a dalt.";
      function count(){ return Object.keys(mine).length; }
      function draw(){
        bars.innerHTML = "";
        bars.appendChild(barRow(n1, d1, "upper"));
        bars.appendChild(barRow(count(), d2, "lower", function(i){
          if (solved) return; if (mine[i]) delete mine[i]; else mine[i] = 1; Taller.msg(msg, ""); draw();
        }, mine));
      }
      if (L.mode === "choose"){
        extra.appendChild(el("span", "", "Trossos de la barra de baix:")).style.fontWeight = "700";
        var holder = el("div"); extra.appendChild(holder);
        var first = true;
        Taller.stepper(holder, { min:2, max:12, value:2, onChange:function(v){ d2 = v; mine = {}; if (!first) Taller.msg(msg, ""); first = false; draw(); } });
      }
      draw();
      chk = el("button", "btn primary", "Comprova"); chk.type = "button";
      chk.addEventListener("click", function(){
        if (solved) return;
        var n2 = count();
        if (L.mode === "choose" && d2 === d1){ Taller.msg(msg, "Així la barra queda partida igual que la de dalt. Prova amb un altre nombre de trossos!", "think"); return; }
        if (n2 * d1 === n1 * d2){ win(n1 + "/" + d1 + " i " + n2 + "/" + d2 + " són la mateixa quantitat de xocolata."); return; }
        if (L.mode === "choose" && (n1 * d2) % d1 !== 0){ Taller.msg(msg, "Amb " + d2 + " trossos no es pot fer exacte: sempre sobra o falta un bocí. Prova amb un altre nombre de trossos.", "think"); return; }
        Taller.msg(msg, n2 * d1 < n1 * d2 ? "Encara és menys que a dalt. Mira fins on arriba el color blau." : "És més que a dalt. Mira fins on arriba el color blau.", "think");
      });
      btns.appendChild(chk);
    } else {
      var A = c[0], B = c[1];
      ask.textContent = "Quina barra té més xocolata pintada?";
      bars.appendChild(barRow(A[0], A[1], "upper"));
      bars.appendChild(barRow(B[0], B[1], "lower"));
      var cmp = A[0] * B[1] - B[0] * A[1];
      var ch = el("div", "choices"); extra.appendChild(ch);
      [["La de dalt", 1], ["La de baix", -1], ["Són iguals", 0]].forEach(function(o){
        var b = el("button", "btn soft", o[0]); b.type = "button";
        b.addEventListener("click", function(){
          if (solved) return;
          var want = cmp > 0 ? 1 : (cmp < 0 ? -1 : 0);
          if (o[1] === want){ win(cmp === 0 ? A[0] + "/" + A[1] + " i " + B[0] + "/" + B[1] + " són iguals." : (cmp > 0 ? A[0] + "/" + A[1] : B[0] + "/" + B[1]) + " és més gran."); }
          else { b.disabled = true; Taller.msg(msg, "Mira bé on acaba el color de cada barra. Les dues barres són igual de llargues.", "think"); }
        });
        ch.appendChild(b);
      });
    }
    btns.appendChild(next); btns.appendChild(back);
    window.scrollTo(0, 0);
  }

  showLevels();
})();
</script>
</body>
</html>
