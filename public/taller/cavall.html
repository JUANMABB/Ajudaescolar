<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#eef2f1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>El cavall saltador</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="Taller">
<link rel="apple-touch-icon" href="../assets/icons/icon-180.png">
<link rel="icon" href="../assets/icons/icon-192.png">
<link rel="stylesheet" href="../assets/base.css">
<link rel="stylesheet" href="../assets/taller.css">
<style>
/* Tauler a l'esquerra (o a dalt al mòbil) i, al costat, l'enunciat, els salts i els botons.
   El cavall es mou tocant la casella on vols que salti. */
.play{display:grid;grid-template-columns:minmax(0,560px) minmax(220px,1fr);gap:16px;align-items:start}
@media (max-width:820px){.play{grid-template-columns:1fr}}
.board{display:grid;border-radius:14px;overflow:hidden;border:3px solid var(--rule);aspect-ratio:1/1;width:100%;max-width:560px;touch-action:manipulation}
.cell{position:relative;border:none;padding:0;display:flex;align-items:center;justify-content:center;aspect-ratio:1/1;min-width:0;background:var(--paper);font-family:var(--font-display)}
.cell.dark{background:var(--accent-soft)}
.cell .k{font-size:min(9vw,52px);line-height:1;color:var(--fg);font-family:"Apple Symbols","Segoe UI Symbol",var(--font-display)}
.cell .star{font-size:min(8vw,44px);line-height:1;color:var(--sun)}
.cell .rock{width:58%;height:58%;border-radius:50% 45% 50% 40%;background:var(--muted);opacity:.75}
.cell .dot{width:26%;height:26%;border-radius:50%;background:var(--accent);opacity:.45}
.cell .step{position:absolute;left:5px;top:3px;font-size:14px;color:var(--muted);font-weight:700}
.side{display:flex;flex-direction:column;gap:12px}
.count{font-family:var(--font-display);font-size:1.4rem;font-weight:700;font-variant-numeric:tabular-nums}
.btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a class="volver" href="./">← Taller</a>
    <h1>El cavall saltador</h1>
  </div>

  <section id="levelsView" class="wrap" style="gap:14px">
    <p class="muted">El cavall dels escacs salta en forma de L: dues caselles cap a un costat i una cap a l'altre. Pot saltar per sobre de tot. Porta'l fins a l'estrella!</p>
    <div class="levels" id="levels"></div>
  </section>

  <section id="playView" class="wrap" style="gap:14px" hidden>
    <div class="row" style="justify-content:space-between">
      <h2 id="levelName"></h2>
      <div class="dots" id="dots"></div>
    </div>
    <div class="stage">
      <div class="play">
        <div class="board" id="board" role="grid" aria-label="Tauler d'escacs"></div>
        <div class="side">
          <p class="ask" id="ask"></p>
          <p class="count" id="count"></p>
          <div class="msg" id="msg" role="status" aria-live="polite"></div>
          <div class="row">
            <button class="btn primary" id="btnNext" type="button" hidden>Següent repte →</button>
            <button class="btn" id="btnUndo" type="button">Desfés</button>
            <button class="btn" id="btnReset" type="button">Torna a començar</button>
          </div>
          <div class="row">
            <button class="btn soft" id="btnHelp" type="button" aria-pressed="true">Mostra on pot saltar</button>
            <button class="btn" id="btnLevels" type="button">Tria nivell</button>
          </div>
        </div>
      </div>
    </div>
  </section>
</div>

<script src="../assets/taller.js"></script>
<script>
(function(){
  var GAME = "cavall";
  var $ = function(id){ return document.getElementById(id); };
  var MOVES = [[1,2],[2,1],[2,-1],[1,-2],[-1,-2],[-2,-1],[-2,1],[-1,2]];

  // Posicions [columna, fila], començant per 0 a dalt a l'esquerra
  var LEVELS = [
    { name:"Un salt", desc:"L'estrella és a un sol salt. On és?", ch:[
      { n:5, start:[2,2], stars:[[3,4]] },
      { n:5, start:[0,0], stars:[[1,2]] },
      { n:5, start:[4,4], stars:[[2,3]] },
      { n:5, start:[1,3], stars:[[3,2]] }
    ]},
    { name:"Dos salts", desc:"Ara cal pensar dos salts seguits.", ch:[
      { n:6, start:[0,0], stars:[[4,2]] },
      { n:6, start:[5,5], stars:[[1,5]] },
      { n:6, start:[2,3], stars:[[2,1]] },
      { n:6, start:[0,5], stars:[[2,5]] }
    ]},
    { name:"Tres salts", desc:"Un tauler gran. Compte: l'estrella sembla a prop, però no ho és!", ch:[
      { n:8, start:[0,0], stars:[[3,0]] },
      { n:8, start:[7,7], stars:[[7,6]] },
      { n:8, start:[3,3], stars:[[4,3]] },
      { n:8, start:[0,7], stars:[[1,7]] }
    ]},
    { name:"Pedres al camí", desc:"El cavall salta per sobre de les pedres, però no hi pot caure.", ch:[
      { n:6, start:[0,0], stars:[[4,2]], rocks:[[2,1]] },
      { n:6, start:[0,5], stars:[[2,5]], rocks:[[1,3],[3,4]] },
      { n:6, start:[5,0], stars:[[1,0]], rocks:[[3,1],[2,2]] },
      { n:7, start:[3,3], stars:[[3,5]], rocks:[[1,4],[5,4],[2,1]] }
    ]},
    { name:"Recull estrelles", desc:"Agafa totes les estrelles, en l'ordre que vulguis.", ch:[
      { n:5, start:[0,0], stars:[[1,2],[3,3]] },
      { n:6, start:[2,2], stars:[[0,1],[4,1],[2,5]] },
      { n:6, start:[0,5], stars:[[5,0],[1,1]], rocks:[[2,2]] },
      { n:8, start:[0,0], stars:[[2,1],[7,7],[4,4]], rocks:[[3,2]] }
    ]}
  ];

  var li = 0, ci = 0, ch, pos, path, got, finished, help = true;

  function cid(l, c){ return "L" + l + "-" + c; }
  function key(p){ return p[0] + "," + p[1]; }
  function isRock(p){ return (ch.rocks || []).some(function(r){ return r[0] === p[0] && r[1] === p[1]; }); }
  function inside(p){ return p[0] >= 0 && p[1] >= 0 && p[0] < ch.n && p[1] < ch.n; }
  function jumps(p){ return MOVES.map(function(m){ return [p[0] + m[0], p[1] + m[1]]; }).filter(function(q){ return inside(q) && !isRock(q); }); }

  // Mínim de salts per recollir totes les estrelles (cerca en amplada)
  function minJumps(c){
    var saved = ch; ch = c;
    var full = (1 << c.stars.length) - 1;
    function mask(p, m){ c.stars.forEach(function(s, i){ if (s[0] === p[0] && s[1] === p[1]) m |= (1 << i); }); return m; }
    var startM = mask(c.start, 0), seen = {}, q = [[c.start, startM, 0]];
    seen[key(c.start) + "|" + startM] = 1;
    while (q.length){
      var cur = q.shift();
      if (cur[1] === full){ ch = saved; return cur[2]; }
      var nx = jumps(cur[0]);
      for (var i = 0; i < nx.length; i++){
        var m = mask(nx[i], cur[1]), k = key(nx[i]) + "|" + m;
        if (!seen[k]){ seen[k] = 1; q.push([nx[i], m, cur[2] + 1]); }
      }
    }
    ch = saved; return -1;
  }

  function showLevels(){
    $("playView").hidden = true; $("levelsView").hidden = false;
    var box = $("levels"); box.innerHTML = "";
    LEVELS.forEach(function(L, i){
      var ids = L.ch.map(function(_, c){ return cid(i, c); }), n = Taller.countDone(GAME, ids);
      var b = document.createElement("button"); b.type = "button"; b.className = "level";
      b.innerHTML = '<span class="n">Nivell ' + (i + 1) + '</span><span class="t"></span><span class="d"></span><span class="done"></span>';
      b.querySelector(".t").textContent = L.name; b.querySelector(".d").textContent = L.desc;
      b.querySelector(".done").textContent = n === ids.length ? "Fet!" : (n ? n + " de " + ids.length + " reptes" : ids.length + " reptes");
      b.addEventListener("click", function(){
        li = i; ci = 0;
        for (var c = 0; c < L.ch.length; c++){ if (!Taller.done(GAME, cid(i, c))) { ci = c; break; } }
        start();
      });
      box.appendChild(b);
    });
    window.scrollTo(0, 0);
  }

  function start(){
    $("levelsView").hidden = true; $("playView").hidden = false;
    var L = LEVELS[li]; ch = L.ch[ci]; ch.min = ch.min || minJumps(ch);
    $("levelName").textContent = "Nivell " + (li + 1) + " · " + L.name;
    Taller.dots($("dots"), L.ch.length, ci, function(i){ return Taller.done(GAME, cid(li, i)); });
    $("ask").textContent = ch.stars.length > 1
      ? "Recull les " + ch.stars.length + " estrelles. Es pot fer en " + ch.min + " salts."
      : "Porta el cavall fins a l'estrella. Es pot fer en " + ch.min + (ch.min === 1 ? " salt." : " salts.");
    reset();
    window.scrollTo(0, 0);
  }

  function reset(){
    pos = ch.start.slice(); path = [pos.slice()]; got = {}; finished = false;
    Taller.msg($("msg"), ""); $("btnNext").hidden = true;
    collect(); draw();
  }

  function collect(){ ch.stars.forEach(function(s){ if (s[0] === pos[0] && s[1] === pos[1]) got[key(s)] = 1; }); }

  function draw(){
    var b = $("board"); b.innerHTML = "";
    b.style.gridTemplateColumns = "repeat(" + ch.n + ", 1fr)";
    var can = {}; if (!finished) jumps(pos).forEach(function(q){ can[key(q)] = 1; });
    var stepAt = {}; path.forEach(function(p, i){ if (i > 0) stepAt[key(p)] = i; });
    for (var r = 0; r < ch.n; r++) for (var c = 0; c < ch.n; c++){
      var p = [c, r], k = key(p);
      var cell = document.createElement("button"); cell.type = "button";
      cell.className = "cell" + ((r + c) % 2 ? " dark" : "");
      var label = "Casella " + (c + 1) + ", " + (r + 1);
      if (pos[0] === c && pos[1] === r){ cell.innerHTML = '<span class="k">♞︎</span>'; label += ": cavall"; }
      else if (ch.stars.some(function(s){ return s[0] === c && s[1] === r; }) && !got[k]){ cell.innerHTML = '<span class="star">★</span>'; label += ": estrella"; }
      else if (isRock(p)){ cell.innerHTML = '<span class="rock"></span>'; label += ": pedra"; }
      else if (help && can[k]){ cell.innerHTML = '<span class="dot"></span>'; }
      if (stepAt[k] && !(pos[0] === c && pos[1] === r)){ cell.insertAdjacentHTML("beforeend", '<span class="step">' + stepAt[k] + '</span>'); }
      cell.setAttribute("aria-label", label);
      (function(p){ cell.addEventListener("click", function(){ tap(p); }); })(p);
      b.appendChild(cell);
    }
    var n = path.length - 1;
    $("count").textContent = "Salts: " + n;
    $("btnUndo").disabled = finished || n === 0;
  }

  function tap(p){
    if (finished) return;
    if (p[0] === pos[0] && p[1] === pos[1]) return;
    if (isRock(p)){ Taller.msg($("msg"), "Aquí hi ha una pedra. El cavall pot saltar per sobre de les pedres, però no hi pot caure.", "think"); return; }
    var ok = jumps(pos).some(function(q){ return q[0] === p[0] && q[1] === p[1]; });
    if (!ok){ Taller.msg($("msg"), "Des d'aquí el cavall no hi arriba. Salta en forma de L: dues caselles cap a un costat i una cap a l'altre.", "think"); return; }
    pos = p.slice(); path.push(pos.slice()); collect();
    Taller.msg($("msg"), "");
    if (ch.stars.every(function(s){ return got[key(s)]; })) win();
    draw();
  }

  function win(){
    finished = true;
    var n = path.length - 1, last = ci === LEVELS[li].ch.length - 1;
    Taller.markDone(GAME, cid(li, ci));
    if (n === ch.min) Taller.msg($("msg"), Taller.praise() + " " + n + (n === 1 ? " salt" : " salts") + ": el camí més curt!" + (last ? " Has acabat el nivell!" : ""), "good");
    else Taller.msg($("msg"), "Ho has aconseguit en " + n + " salts! Es pot fer en " + ch.min + ". Si vols, torna a començar i busca un camí més curt.", "good");
    $("btnNext").hidden = false; $("btnNext").textContent = last ? "Tria un altre nivell" : "Següent repte →";
    Taller.dots($("dots"), LEVELS[li].ch.length, ci, function(i){ return Taller.done(GAME, cid(li, i)); });
  }

  $("btnUndo").addEventListener("click", function(){
    if (finished || path.length < 2) return;
    path.pop(); pos = path[path.length - 1].slice();
    got = {}; path.forEach(function(p){ ch.stars.forEach(function(s){ if (s[0] === p[0] && s[1] === p[1]) got[key(s)] = 1; }); });
    Taller.msg($("msg"), ""); draw();
  });
  $("btnReset").addEventListener("click", reset);
  $("btnHelp").addEventListener("click", function(){ help = !help; this.setAttribute("aria-pressed", String(help)); draw(); });
  $("btnNext").addEventListener("click", function(){ if (ci < LEVELS[li].ch.length - 1){ ci++; start(); } else showLevels(); });
  $("btnLevels").addEventListener("click", showLevels);

  window.__cavall = { LEVELS:LEVELS, minJumps:minJumps };
  showLevels();
})();
</script>
</body>
</html>
