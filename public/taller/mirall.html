<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#eef2f1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>El mirall</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="Taller">
<link rel="apple-touch-icon" href="../assets/icons/icon-180.png">
<link rel="icon" href="../assets/icons/icon-192.png">
<link rel="stylesheet" href="../assets/base.css">
<link rel="stylesheet" href="../assets/taller.css">
<style>
/* Quadrícula de 8×8 amb el mirall marcat. Una part ja està pintada; ell pinta l'altra tocant els quadrets. */
.play{display:grid;grid-template-columns:minmax(0,560px) minmax(220px,1fr);gap:16px;align-items:start}
@media (max-width:820px){.play{grid-template-columns:1fr}}
.gridWrap{position:relative;width:100%;max-width:560px;aspect-ratio:1/1}
.grid{display:grid;grid-template-columns:repeat(8,1fr);gap:3px;width:100%;height:100%;padding:3px;border-radius:14px;background:var(--rule-soft);touch-action:manipulation}
.sq{border:none;border-radius:6px;background:var(--paper);padding:0;min-width:0}
.sq.given{background:var(--sky)}
.sq.mine{background:var(--warm)}
.sq.locked{background:var(--surface)}
.sq.hintMiss{box-shadow:inset 0 0 0 4px var(--sky)}
.sq.hintExtra{box-shadow:inset 0 0 0 4px var(--warm);opacity:.6}
.axis{position:absolute;pointer-events:none;background:var(--plum);opacity:.85;border-radius:3px}
.axis.d{height:5px;left:0;top:0;transform-origin:0 50%;width:141.42%;transform:rotate(45deg)}
.side{display:flex;flex-direction:column;gap:12px}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:16px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:16px;height:16px;border-radius:4px;margin-right:6px;vertical-align:-2px}
.legend .g::before{background:var(--sky)} .legend .m::before{background:var(--warm)} .legend .a::before{background:var(--plum);height:6px;vertical-align:4px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a class="volver" href="./">← Taller</a>
    <h1>El mirall</h1>
  </div>

  <section id="levelsView" class="wrap" style="gap:14px">
    <p class="muted">La línia lila és un mirall. Una part del dibuix ja hi és: pinta la seva imatge a l'altra banda del mirall.</p>
    <div class="levels" id="levels"></div>
  </section>

  <section id="playView" class="wrap" style="gap:14px" hidden>
    <div class="row" style="justify-content:space-between">
      <h2 id="levelName"></h2>
      <div class="dots" id="dots"></div>
    </div>
    <div class="stage">
      <div class="play">
        <div class="gridWrap"><div class="grid" id="grid"></div><div id="axes"></div></div>
        <div class="side">
          <p class="ask" id="ask"></p>
          <div class="legend"><span class="g">Ja pintat</span><span class="m">El que pintes tu</span><span class="a">Mirall</span></div>
          <div class="msg" id="msg" role="status" aria-live="polite"></div>
          <div class="row">
            <button class="btn primary" id="btnCheck" type="button">Comprova</button>
            <button class="btn primary" id="btnNext" type="button" hidden>Següent repte →</button>
            <button class="btn soft" id="btnHint" type="button">Una pista</button>
          </div>
          <div class="row">
            <button class="btn" id="btnClear" type="button">Esborra el que he pintat</button>
            <button class="btn" id="btnLevels" type="button">Tria nivell</button>
          </div>
        </div>
      </div>
    </div>
  </section>
</div>

<script src="../assets/taller.js"></script>
<script>
(function(){
  var GAME = "mirall", N = 8;
  var $ = function(id){ return document.getElementById(id); };

  // Dibuixos: files de text. '#' = quadret pintat. Només es fa servir la part de "font" de cada mirall.
  function cells(rows){ var out = []; rows.forEach(function(r, y){ for (var x = 0; x < r.length; x++) if (r[x] === "#") out.push([x, y]); }); return out; }

  var AX = {
    v:{ img:function(c){ return [[N - 1 - c[0], c[1]]]; }, src:function(c){ return c[0] < N / 2; }, text:"El mirall és vertical. Pinta la part de la dreta." },
    h:{ img:function(c){ return [[c[0], N - 1 - c[1]]]; }, src:function(c){ return c[1] < N / 2; }, text:"El mirall és horitzontal. Pinta la part de baix." },
    b:{ img:function(c){ return [[N - 1 - c[0], c[1]], [c[0], N - 1 - c[1]], [N - 1 - c[0], N - 1 - c[1]]]; }, src:function(c){ return c[0] < N / 2 && c[1] < N / 2; }, text:"Hi ha dos miralls. Pinta els altres tres trossos." },
    d:{ img:function(c){ return [[c[1], c[0]]]; }, src:function(c){ return c[1] >= c[0]; }, text:"El mirall va en diagonal. Pinta la part de dalt a la dreta." }
  };

  var LEVELS = [
    { name:"Mirall vertical", desc:"El mirall va de dalt a baix.", ch:[
      { ax:"v", p:cells(["....",".##.","####","####",".###","..##","...#","...."]) },
      { ax:"v", p:cells(["...#","..##",".###","####",".#..",".#.#",".#.#",".###"]) },
      { ax:"v", p:cells(["...#","..##","..##","..#.","..##",".###","#..#","...."]) },
      { ax:"v", p:cells(["..#.","...#","..##",".##.","####","#.##","#.#.","...#"]) }
    ]},
    { name:"Mirall horitzontal", desc:"El mirall va d'esquerra a dreta.", ch:[
      { ax:"h", p:cells(["...##...","..####..",".######.","########"]) },
      { ax:"h", p:cells(["#......#",".#....#.","..#..#..","...##..."]) },
      { ax:"h", p:cells(["........","##....#.","####.###","########"]) }
    ]},
    { name:"Dos miralls", desc:"Un tros i tres imatges. Compte amb les cantonades!", ch:[
      { ax:"b", p:cells(["#...",".#..","..##","..##"]) },
      { ax:"b", p:cells(["##..","#...","....","...#"]) },
      { ax:"b", p:cells(["..##",".#..","#..#","#.##"]) }
    ]},
    { name:"Mirall en diagonal", desc:"El més difícil: el mirall està inclinat.", ch:[
      { ax:"d", p:cells(["#.......","##......","#.#.....","#..#....","#...#...","#....#..","#######.","........"]) },
      { ax:"d", p:cells(["........","#.......","##......","..#.....","...#....","....#...",".....#..","######.."]) },
      { ax:"d", p:cells(["........","........","##......","##......","........","...##...","...##...","........"]) }
    ]},
    { name:"Dibuix lliure", desc:"Pinta el que vulguis i els miralls ho copien. Un calidoscopi!", free:true, ch:[ { ax:"b", p:[] } ] }
  ];

  var li, ci, ch, given, target, mine, solved, hintOn;
  function k(c){ return c[0] + "," + c[1]; }

  function showLevels(){
    $("playView").hidden = true; $("levelsView").hidden = false;
    Taller.levelCards($("levels"), GAME, LEVELS, function(l, c){ li = l; ci = c; start(); });
    window.scrollTo(0, 0);
  }

  function start(){
    $("levelsView").hidden = true; $("playView").hidden = false;
    var L = LEVELS[li]; ch = L.ch[ci];
    $("levelName").textContent = "Nivell " + (li + 1) + " · " + L.name;
    if (L.free) $("dots").innerHTML = ""; else Taller.dots($("dots"), L.ch.length, ci, function(i){ return Taller.done(GAME, "L" + li + "-" + i); });
    $("ask").textContent = L.free ? "Toca els quadrets de dalt a l'esquerra. Els miralls pintaran la resta." : AX[ch.ax].text;
    given = {}; target = {}; mine = {}; solved = false; hintOn = false;
    if (!L.free) Taller.begin(GAME, "L" + li + "-" + ci);
    var A = AX[ch.ax];
    ch.p.forEach(function(c){
      if (!A.src(c)) return;
      given[k(c)] = 1;
      A.img(c).forEach(function(m){ if (!given[k(m)]) target[k(m)] = 1; });
    });
    Object.keys(given).forEach(function(key){ delete target[key]; });   // quadrets damunt del mirall diagonal
    $("btnCheck").hidden = !!L.free; $("btnHint").hidden = !!L.free; $("btnNext").hidden = true;
    Taller.msg($("msg"), ""); drawAxes(); draw();
    window.scrollTo(0, 0);
  }

  function editable(c){
    var A = AX[ch.ax];
    if (LEVELS[li].free) return A.src(c);
    return !A.src(c);
  }

  function draw(){
    var g = $("grid"); g.innerHTML = "";
    var free = LEVELS[li].free, A = AX[ch.ax];
    for (var y = 0; y < N; y++) for (var x = 0; x < N; x++){
      var c = [x, y], key = k(c), b = document.createElement("button"); b.type = "button";
      var cls = "sq";
      if (free){
        var on = mine[key] || (Object.keys(mine).some(function(m){ var p = m.split(",").map(Number); return A.img(p).some(function(q){ return k(q) === key; }); }));
        if (on) cls += A.src(c) ? " mine" : " given";
        else if (!A.src(c)) cls += " locked";
      } else {
        if (given[key]) cls += " given";
        else if (mine[key]) cls += " mine";
        if (hintOn && !solved){ if (target[key] && !mine[key]) cls += " hintMiss"; if (mine[key] && !target[key]) cls += " hintExtra"; }
      }
      b.className = cls;
      b.setAttribute("aria-label", "Quadret " + (x + 1) + ", " + (y + 1) + (given[key] ? ", ja pintat" : (mine[key] ? ", pintat per tu" : "")));
      (function(c, key){ b.addEventListener("click", function(){ tap(c, key); }); })(c, key);
      g.appendChild(b);
    }
  }

  function drawAxes(){
    var box = $("axes"); box.innerHTML = "";
    function bar(style, cls){ var d = document.createElement("div"); d.className = "axis" + (cls ? " " + cls : ""); d.setAttribute("style", style); box.appendChild(d); }
    if (ch.ax === "v" || ch.ax === "b") bar("left:calc(50% - 3px);top:-6px;bottom:-6px;width:6px");
    if (ch.ax === "h" || ch.ax === "b") bar("top:calc(50% - 3px);left:-6px;right:-6px;height:6px");
    if (ch.ax === "d") bar("", "d");
  }

  function tap(c, key){
    if (solved || given[key] || !editable(c)) {
      if (!solved && !LEVELS[li].free && !given[key]) Taller.msg($("msg"), "Aquesta banda ja està feta. Pinta a l'altra banda del mirall.", "think");
      return;
    }
    if (mine[key]) delete mine[key]; else mine[key] = 1;
    Taller.msg($("msg"), ""); draw();
  }

  function check(){
    if (solved) return;
    var miss = Object.keys(target).filter(function(t){ return !mine[t]; }).length;
    var extra = Object.keys(mine).filter(function(m){ return !target[m]; }).length;
    if (!miss && !extra){
      solved = true; hintOn = false; Taller.markDone(GAME, "L" + li + "-" + ci);
      var last = ci === LEVELS[li].ch.length - 1;
      Taller.msg($("msg"), Taller.praise() + " El dibuix és simètric." + (last ? " Has acabat el nivell!" : ""), "good");
      $("btnNext").hidden = false; $("btnNext").textContent = last ? "Tria un altre nivell" : "Següent repte →";
      $("btnCheck").hidden = true;
      Taller.dots($("dots"), LEVELS[li].ch.length, ci, function(i){ return Taller.done(GAME, "L" + li + "-" + i); });
      draw(); return;
    }
    Taller.tried();
    var parts = [];
    if (miss) parts.push(miss === 1 ? "falta 1 quadret" : "falten " + miss + " quadrets");
    if (extra) parts.push(extra === 1 ? "n'hi ha 1 que no va" : "n'hi ha " + extra + " que no van");
    Taller.msg($("msg"), "Gairebé! " + parts.join(" i ") + ". Si vols, demana una pista.", "think");
  }

  $("btnCheck").addEventListener("click", check);
  $("btnHint").addEventListener("click", function(){
    if (solved) return;
    hintOn = true; Taller.hinted(); draw();
    Taller.msg($("msg"), "Pista: el contorn blau marca on falta pintar i el taronja clar, el que sobra. Compta quants quadrets hi ha fins al mirall a cada banda.", "think");
  });
  $("btnClear").addEventListener("click", function(){ if (!solved){ mine = {}; hintOn = false; Taller.msg($("msg"), ""); draw(); } });
  $("btnNext").addEventListener("click", function(){ if (ci < LEVELS[li].ch.length - 1){ ci++; start(); } else showLevels(); });
  $("btnLevels").addEventListener("click", showLevels);
  showLevels();
})();
</script>
</body>
</html>
